<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - CollabSims</title>

  <!-- Tailwind CSS with dark mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <div x-data="projectsPage()" x-init="init()" x-cloak>
    <!-- Header -->
    <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex justify-between items-center">
          <div>
            <h1 class="text-3xl font-bold">CollabSims Projects</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-1">Manage your projects and sessions</p>
          </div>
          <div class="flex gap-3">
            <button @click="toggleTheme()" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition" title="Toggle theme">
              <svg x-show="theme === 'light'" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
              </svg>
              <svg x-show="theme === 'dark'" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
              </svg>
            </button>
            <button @click="loadData()" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg transition-colors">
              Refresh
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 text-center">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      <p class="mt-4 text-gray-600 dark:text-gray-400">Loading projects...</p>
    </div>

    <!-- Error State -->
    <div x-show="error" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-6">
        <h3 class="text-lg font-semibold text-red-900 dark:text-red-200 mb-2">Error Loading Data</h3>
        <p class="text-red-700 dark:text-red-300" x-text="error"></p>
        <button @click="loadData()" class="mt-4 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors">
          Retry
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div x-show="!loading && !error && projects.length === 0" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 text-center">
      <div class="bg-white dark:bg-gray-800 rounded-lg p-12 border border-gray-200 dark:border-gray-700">
        <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
        </svg>
        <h3 class="mt-4 text-lg font-semibold">No projects found</h3>
        <p class="mt-2 text-gray-600 dark:text-gray-400">Create project markdown files in the data/projects/ directory.</p>
      </div>
    </div>

    <!-- Projects List -->
    <div x-show="!loading && !error && projects.length > 0" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <template x-for="project in projects" :key="project.name">
        <div class="mb-4 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden">
          <!-- Project Header -->
          <div class="bg-gray-50 dark:bg-gray-900 px-6 py-4 flex items-center justify-between cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" @click="toggleProject(project.name)">
            <div class="flex items-center gap-3">
              <!-- Expand/Collapse Icon -->
              <svg :class="isProjectExpanded(project.name) ? 'rotate-90' : ''" class="w-5 h-5 text-gray-500 transition-transform" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
              </svg>

              <!-- Project Icon -->
              <svg class="w-6 h-6 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
              </svg>

              <div>
                <h2 class="text-lg font-semibold" x-text="project.title || project.name"></h2>
                <p class="text-sm text-gray-600 dark:text-gray-400" x-text="project.type || 'No type'"></p>
              </div>

              <!-- Session & Activity Count Badges -->
              <div class="ml-3 flex gap-2">
                <span class="px-2 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300 text-xs font-medium rounded-full" x-text="getProjectSessions(project.name).length + ' sessions'"></span>
                <span class="px-2 py-1 bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-300 text-xs font-medium rounded-full" x-text="(project.completed_activities || 0) + ' activities'"></span>
              </div>
            </div>

            <!-- New Session Button -->
            <button @click.stop="createSession(project.name, null)" :disabled="creatingSessionFor === project.name" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
              <svg x-show="creatingSessionFor !== project.name" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
              </svg>
              <div x-show="creatingSessionFor === project.name" class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
              <span x-text="creatingSessionFor === project.name ? 'Creating...' : 'New Session'"></span>
            </button>
          </div>

          <!-- Sessions List -->
          <div x-show="isProjectExpanded(project.name)" x-collapse>
            <template x-if="getProjectSessions(project.name).length === 0">
              <div class="px-6 py-8 text-center text-gray-500 dark:text-gray-400">
                <p class="text-sm">No sessions yet. Create one to get started!</p>
              </div>
            </template>

            <template x-if="getProjectSessions(project.name).length > 0">
              <div class="divide-y divide-gray-200 dark:divide-gray-700">
                <template x-for="session in getProjectSessions(project.name)" :key="session.session_id">
                  <div class="px-6 py-4 hover:bg-gray-50 dark:hover:bg-gray-900 cursor-pointer transition-colors" @click="viewSession(session.session_id)">
                    <div class="flex items-center justify-between">
                      <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                          <!-- Session Icon -->
                          <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                          </svg>

                          <!-- Session Name or ID -->
                          <span class="font-medium" x-text="session.session_name || truncateId(session.session_id)"></span>

                          <!-- Session ID Badge -->
                          <span class="inline-flex items-center gap-1.5 px-2 py-0.5 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 text-xs font-mono rounded-md" :title="session.session_id">
                            <span x-text="truncateId(session.session_id)"></span>
                            <button @click="copyToClipboard(session.session_id, $event)" class="hover:text-gray-900 dark:hover:text-gray-200" title="Copy full ID">
                              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                              </svg>
                            </button>
                          </span>

                          <!-- Agent Badge -->
                          <span x-show="session.agent_name" class="inline-flex items-center px-2 py-0.5 bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 text-xs font-medium rounded-md">
                            <span x-text="session.agent_name"></span>
                          </span>
                        </div>

                        <!-- Session Meta -->
                        <div class="flex items-center gap-4 text-xs text-gray-500 dark:text-gray-400">
                          <span x-text="'Created ' + formatDate(session.created_at)"></span>
                          <span x-text="session.query_count + ' queries'"></span>
                        </div>
                      </div>

                      <!-- Actions -->
                      <div class="flex items-center gap-2">
                        <button @click.stop="viewSession(session.session_id)" class="px-3 py-1 text-blue-600 hover:text-blue-800 dark:text-blue-400 dark:hover:text-blue-300 text-sm font-medium">
                          Open
                        </button>
                        <button @click.stop="deleteSession(session.session_id, $event)" class="px-3 py-1 text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 text-sm font-medium">
                          Delete
                        </button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Summary -->
      <div class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
        <span x-text="projects.length"></span> project<span x-text="projects.length !== 1 ? 's' : ''"></span> ·
        <span x-text="sessions.length"></span> session<span x-text="sessions.length !== 1 ? 's' : ''"></span>
      </div>
    </div>
  </div>

  <!-- Alpine.js bootstrap -->
  <script type="module">
    import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3/dist/module.esm.js';
    import Collapse from 'https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3/dist/module.esm.js';
    import { projectsListComponent } from '../js/components/projects/projectsListComponent.js?v=5';

    // Register collapse plugin
    Alpine.plugin(Collapse);

    // Register component
    Alpine.data('projectsPage', projectsListComponent);
    Alpine.start();
  </script>
</body>
</html>
