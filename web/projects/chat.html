<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sims Agent</title>

  <!-- Tailwind CSS with dark mode -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- DaisyUI Component Library -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      daisyui: {
        themes: ["light", "dark"],
        darkTheme: "dark",
        base: true,
        styled: true,
        utils: true,
      }
    }
  </script>

  <!-- Alpine.js will be loaded via ES6 module (see bootstrap at end of body) -->

  <!-- Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/bash.min.js"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/markdown.css">

  <style>
    [x-cloak] { display: none !important; }

    /* Pulse animation for live metrics */
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
      }
      50% {
        box-shadow: 0 0 8px 2px rgba(59, 130, 246, 0.4);
      }
    }

    .pulse-live {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* Custom scrollbar styling */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(156, 163, 175, 0.5) transparent;
    }

    .dark * {
      scrollbar-color: rgba(75, 85, 99, 0.5) transparent;
    }

    /* Webkit browsers (Chrome, Safari, Edge) */
    *::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 4px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    *::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 114, 128, 0.7);
      background-clip: padding-box;
    }

    /* Dark mode scrollbar */
    .dark *::-webkit-scrollbar-thumb {
      background: rgba(75, 85, 99, 0.5);
      background-clip: padding-box;
    }

    .dark *::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 114, 128, 0.7);
      background-clip: padding-box;
    }
  </style>

  <!-- Theme initialization script (runs before render) -->
  <script>
    // Initialize theme before page renders to avoid flash
    (function() {
      const theme = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
  <div
    x-data="simsApp()"
    x-init="init()"
    class="h-screen flex flex-col"
  >
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 transition-colors duration-200" style="height: 72px;">
      <div class="h-full flex items-center justify-between">
        <div class="flex items-center gap-4">
          <!-- Process Navigator button (navigation) -->
          <a
            href="/projects/"
            class="flex items-center gap-2 px-3 py-1.5 text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition text-sm font-medium"
            title="View all projects"
          >
            <span class="text-lg">🧭</span>
            <span>Process Navigator</span>
          </a>

          <div class="h-8 w-px bg-gray-300 dark:bg-gray-600"></div>

          <div class="flex flex-col justify-center gap-1">
            <!-- Header: Project Title | Session Name -->
            <h1 class="text-xl font-bold text-gray-900 dark:text-white">
              <span x-text="projectTitle || projectName || 'CollabSims'"></span>
              <span class="text-gray-400"> || </span>
              <span class="text-gray-600 dark:text-gray-400 text-base font-normal italic">"<span x-text="sessionName || 'unnamed'"></span>"</span>
            </h1>
            <!-- Project ID -->
            <p x-show="projectType" class="text-sm text-gray-600 dark:text-gray-400" x-text="projectType"></p>
          </div>
        </div>

        <div class="flex items-center gap-6">
          <!-- Theme toggle (left side, separated) -->
          <button
            @click="toggleTheme()"
            class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition"
            title="Toggle theme"
          >
            <svg x-show="theme === 'light'" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
            <svg x-show="theme === 'dark'" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
            </svg>
          </button>

          <!-- Action buttons group (right side) -->
          <div class="flex items-center gap-2">
            <!-- Approval Mode Dropdown -->
            <div class="relative" @click.outside="showApprovalModeDropdown = false">
              <button
                @click="showApprovalModeDropdown = !showApprovalModeDropdown"
                class="flex items-center gap-2 px-4 py-2 text-sm font-medium bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition"
                title="Change approval mode"
              >
                <span x-text="getApprovalModeIcon()"></span>
                <span x-text="getApprovalModeLabel()"></span>
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
              </button>

              <!-- Dropdown menu -->
              <div
                x-show="showApprovalModeDropdown"
                x-cloak
                x-transition
                class="absolute right-0 mt-2 w-56 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-lg z-50"
              >
                <div class="py-1">
                  <button
                    @click="setApprovalMode('auto')"
                    class="w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center space-x-3"
                    :class="approvalMode === 'auto' ? 'bg-blue-50 dark:bg-blue-900 text-blue-600 dark:text-blue-400' : 'text-gray-700 dark:text-gray-300'"
                  >
                    <span class="text-lg">🔓</span>
                    <div>
                      <div class="font-medium">Auto</div>
                      <div class="text-xs text-gray-500 dark:text-gray-400">No approval needed</div>
                    </div>
                  </button>

                  <button
                    @click="setApprovalMode('interactive')"
                    class="w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center space-x-3"
                    :class="approvalMode === 'interactive' ? 'bg-blue-50 dark:bg-blue-900 text-blue-600 dark:text-blue-400' : 'text-gray-700 dark:text-gray-300'"
                  >
                    <span class="text-lg">🔐</span>
                    <div>
                      <div class="font-medium">Interactive</div>
                      <div class="text-xs text-gray-500 dark:text-gray-400">Smart approvals</div>
                    </div>
                  </button>

                  <button
                    @click="setApprovalMode('manual')"
                    class="w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center space-x-3"
                    :class="approvalMode === 'manual' ? 'bg-blue-50 dark:bg-blue-900 text-blue-600 dark:text-blue-400' : 'text-gray-700 dark:text-gray-300'"
                  >
                    <span class="text-lg">🔒</span>
                    <div>
                      <div class="font-medium">Manual</div>
                      <div class="text-xs text-gray-500 dark:text-gray-400">All tools need approval</div>
                    </div>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- ========================================
         MAIN CONTENT AREA
         ======================================== -->
    <!-- Main content -->
    <div class="flex-1 flex overflow-hidden">
      <!-- ========================================
           LEFT PANEL: CHAT MESSAGES
           ======================================== -->
      <!-- Left: Chat -->
      <div class="flex-1 flex flex-col bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700">
        <!-- Skeleton Loading for Messages -->
        <div
          x-show="isRestoringSession"
          x-cloak
          class="flex-1 overflow-y-auto p-6 space-y-4 animate-pulse"
        >
          <!-- Skeleton message bubbles -->
          <div class="flex justify-end">
            <div class="max-w-3xl w-80 h-16 bg-blue-200 dark:bg-blue-800 rounded-lg"></div>
          </div>
          <div class="flex justify-start">
            <div class="max-w-3xl w-96 h-24 bg-gray-200 dark:bg-gray-700 rounded-lg"></div>
          </div>
          <div class="flex justify-end">
            <div class="max-w-3xl w-72 h-14 bg-blue-200 dark:bg-blue-800 rounded-lg"></div>
          </div>
          <div class="flex justify-start">
            <div class="max-w-3xl w-full h-32 bg-gray-200 dark:bg-gray-700 rounded-lg"></div>
          </div>
        </div>

        <!-- Messages -->
        <div
          x-show="!isRestoringSession"
          x-cloak
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0"
          x-transition:enter-end="opacity-100"
          class="flex-1 overflow-y-auto p-6 space-y-4"
          x-ref="messagesContainer"
        >
          <!-- Loading state -->
          <div
            x-show="isInitializing"
            class="h-full flex items-center justify-center text-gray-400 dark:text-gray-500"
          >
            <div class="text-center">
              <div class="inline-flex space-x-2 mb-4">
                <div class="w-3 h-3 bg-gray-400 dark:bg-gray-500 rounded-full animate-bounce"></div>
                <div class="w-3 h-3 bg-gray-400 dark:bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-3 h-3 bg-gray-400 dark:bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
              </div>
              <p class="text-lg">Creating session...</p>
            </div>
          </div>

          <!-- Empty state -->
          <div
            x-show="!sessionId && !isInitializing && messages.length === 0"
            class="h-full flex items-center justify-center text-gray-400 dark:text-gray-500"
          >
            <div class="text-center">
              <svg class="mx-auto h-12 w-12 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
              </svg>
              <p class="text-lg">Create a session to start chatting</p>
            </div>
          </div>

          <!-- Messages and Tools -->
          <template x-for="(msg, msgIndex) in messages" :key="msg.id">
            <div>
              <!-- Regular Messages (user/assistant) -->
              <div
                x-show="msg.role === 'user' || msg.role === 'assistant'"
                class="flex"
                :class="msg.role === 'user' ? 'justify-end' : 'justify-start'"
              >
                <div
                  class="max-w-3xl px-4 py-3 rounded-lg"
                  :class="msg.role === 'user'
                    ? 'bg-blue-600 dark:bg-blue-500 text-white'
                    : 'bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-gray-100'"
                >
                  <!-- Thinking indicator -->
                  <div
                    x-show="msg.thinking"
                    class="text-xs opacity-75 mb-2 italic"
                  >
                    <span class="font-semibold">Thinking:</span>
                    <span x-text="msg.thinking"></span>
                  </div>

                  <!-- Content -->
                  <div
                    class="markdown-content"
                    x-html="renderMarkdown(msg.content)"
                  ></div>

                  <!-- Timestamp -->
                  <div
                    class="text-xs mt-2 opacity-75"
                    x-text="new Date(msg.timestamp).toLocaleTimeString()"
                  ></div>
                </div>
              </div>

              <!-- Tool Group Card -->
              <div
                x-show="msg.role === 'tool_group'"
                x-data="{ toolGroup: getToolGroup(msg.tool_group_id) }"
                class="flex justify-start my-2"
              >
                <div class="rounded-lg bg-gradient-to-r from-gray-50/50 to-slate-50/50 dark:from-gray-900/10 dark:to-slate-900/10 border border-gray-300/60 dark:border-gray-700/40 shadow-sm max-w-3xl" :class="{'w-full': toolGroup?.expanded}">
                  <!-- Header -->
                  <button
                    @click="toggleToolGroup(msg.tool_group_id)"
                    class="w-full px-3 py-2 flex items-center gap-2 hover:bg-white/40 dark:hover:bg-gray-800/20 transition-colors rounded-lg text-sm"
                  >
                    <!-- Minimalist chevron icon -->
                    <svg
                      class="w-3.5 h-3.5 text-gray-600 dark:text-gray-400 flex-shrink-0 transition-transform"
                      :class="{'rotate-90': toolGroup?.expanded}"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>

                    <span class="text-gray-700 dark:text-gray-300 font-medium">
                      <span x-text="toolGroup?.tools?.length || 0"></span> tool<span x-show="toolGroup?.tools?.length !== 1">s</span>
                    </span>
                    <span class="text-xs text-gray-600 dark:text-gray-400">
                      (<span x-text="toolGroup?.tools?.filter(t => t.result).length || 0"></span>/<span x-text="toolGroup?.tools?.length || 0"></span>)
                    </span>
                    <span class="text-xs text-gray-500/70 dark:text-gray-400/70 ml-auto" x-text="new Date(msg.timestamp).toLocaleTimeString()"></span>
                  </button>

                  <!-- Expanded Tool List -->
                  <div
                    x-show="toolGroup?.expanded"
                    x-collapse.duration.200ms
                    class="px-3 pb-3 space-y-3"
                  >
                    <template x-for="(tool, index) in toolGroup?.tools" :key="tool.use.tool_use_id">
                      <div class="bg-white/50 dark:bg-gray-900/20 rounded p-2.5 shadow-sm" :class="{'pt-3 mt-3 border-t border-gray-200/60 dark:border-gray-700/30': index > 0}">
                        <!-- Tool Header -->
                        <div class="flex items-center gap-2 mb-1.5">
                          <span class="text-sm" x-show="!tool.result">⏳</span>
                          <span class="text-sm text-green-600 dark:text-green-400" x-show="tool.result">✓</span>
                          <span class="font-mono text-sm font-semibold text-gray-900 dark:text-gray-100" x-text="tool.use.tool_name"></span>
                        </div>

                        <!-- Tool Input -->
                        <div class="mt-2">
                          <div class="text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Input</div>
                          <div class="text-xs bg-white dark:bg-gray-900/30 p-2 rounded overflow-x-auto" x-html="formatToolInput(tool.use.tool_name, tool.use.input)"></div>
                        </div>

                        <!-- Tool Result -->
                        <div x-show="tool.result" class="mt-2">
                          <div class="text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1">Result</div>
                          <div class="text-xs bg-white dark:bg-gray-900/30 p-2 rounded overflow-x-auto max-h-80 overflow-y-auto" x-html="formatToolOutput(tool.use.tool_name, tool.result?.output)"></div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Activity Card -->
              <div
                x-show="msg.role === 'activity_card'"
                class="flex justify-start my-2"
              >
                <div class="rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm max-w-3xl w-full">
                  <!-- Card Header (always visible) -->
                  <div class="px-4 py-3" :class="{ 'border-b border-gray-200 dark:border-gray-700': msgIndex === messages.length - 1 }">
                    <div class="flex items-center justify-between">
                      <h3 class="text-base font-semibold text-gray-900 dark:text-gray-100" x-text="msg.activityData?.activity_title"></h3>
                      <span
                        x-show="msg.activityData?.activity_completed"
                        class="text-lg text-green-500 dark:text-green-400"
                      >
                        ✓
                      </span>
                    </div>
                  </div>

                  <!-- Card Body (only visible if last message) -->
                  <div x-show="msgIndex === messages.length - 1" class="px-4 py-3 space-y-3">
                    <!-- Description -->
                    <p class="text-sm text-gray-700 dark:text-gray-300" x-text="msg.activityData?.activity_description"></p>

                    <!-- Definition of Done (Checkboxes) -->
                    <div x-show="msg.activityData?.verifications?.length > 0">
                      <h4 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Definition of Done</h4>
                      <div class="space-y-1.5">
                        <template x-for="(verification, verIndex) in msg.activityData?.verifications || []" :key="verIndex">
                          <label class="flex items-start gap-2 cursor-pointer group">
                            <input
                              type="checkbox"
                              class="mt-0.5 rounded border-gray-300 dark:border-gray-600 text-blue-600 focus:ring-blue-500 dark:focus:ring-blue-400 dark:bg-gray-700"
                              :checked="verification.checked || false"
                              @change="toggleVerification(msg.id, verIndex, $event.target.checked)"
                            >
                            <div class="flex-1">
                              <p class="text-sm text-gray-900 dark:text-gray-100 group-hover:text-gray-700 dark:group-hover:text-gray-300" x-text="typeof verification === 'string' ? verification : (verification.title || verification.text || verification)"></p>
                              <p x-show="typeof verification === 'object' && verification.description" class="text-xs text-gray-600 dark:text-gray-400" x-text="verification.description"></p>
                            </div>
                          </label>
                        </template>
                      </div>
                    </div>
                  </div>

                  <!-- Card Footer - Action Buttons (only visible if last message) -->
                  <div x-show="msgIndex === messages.length - 1" class="px-4 py-2 bg-gray-100 dark:bg-gray-900/30 border-t border-gray-200 dark:border-gray-700 flex flex-wrap gap-2">
                    <button
                      @click="prompt = `Execute a atividade: ${msg.activityData?.activity_title}`; sendMessage()"
                      class="px-3 py-1 text-xs bg-green-600 dark:bg-green-700 text-white rounded hover:bg-green-700 dark:hover:bg-green-600 transition font-semibold"
                      title="Disparar execução da atividade"
                    >
                      Criar
                    </button>
                    <button
                      @click="console.log('Ajuda:', msg.activityData)"
                      class="px-3 py-1 text-xs bg-gray-600 dark:bg-gray-700 text-white rounded hover:bg-gray-700 dark:hover:bg-gray-600 transition"
                    >
                      Ajuda
                    </button>
                    <button
                      @click="activeTab = 'activities'; expandedActivityGroups.clear(); expandedActivityGroups.add(msg.activityData?.activity_script); expandedActivityGroups = new Set(expandedActivityGroups)"
                      class="px-3 py-1 text-xs bg-gray-600 dark:bg-gray-700 text-white rounded hover:bg-gray-700 dark:hover:bg-gray-600 transition"
                    >
                      Ver Outputs
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- Partial streaming indicator -->
          <div
            x-show="partialText"
            class="flex justify-start"
          >
            <div class="max-w-3xl px-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-gray-100">
              <div class="markdown-content" x-html="renderMarkdown(partialText)"></div>
              <div class="inline-block w-2 h-4 bg-gray-400 dark:bg-gray-500 animate-pulse ml-1"></div>
            </div>
          </div>

          <!-- Loading indicator -->
          <div
            x-show="isStreaming && !partialText"
            class="flex justify-start"
          >
            <div class="px-4 py-3 rounded-lg bg-gray-100 dark:bg-gray-700">
              <div class="flex space-x-1">
                <div class="w-2 h-2 bg-gray-400 dark:bg-gray-500 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-gray-400 dark:bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-2 h-2 bg-gray-400 dark:bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
              </div>
            </div>
          </div>

        </div>

        <!-- Input -->
        <div class="border-t border-gray-200 dark:border-gray-700 p-4">
          <form @submit.prevent="sendMessage()" class="flex space-x-3">
            <input
              type="text"
              x-ref="promptInput"
              x-model="prompt"
              :disabled="!sessionId || isStreaming"
              placeholder="Ask anything..."
              class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 disabled:bg-gray-100 dark:disabled:bg-gray-800 disabled:cursor-not-allowed"
            >
            <!-- Interrupt button (only show when streaming) -->
            <button
              type="button"
              x-show="isStreaming"
              @click="interruptSession()"
              class="px-4 py-2 bg-red-500 dark:bg-red-600 text-white rounded-lg hover:bg-red-600 dark:hover:bg-red-700 transition flex items-center gap-2"
              title="Stop the current query"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5"></path>
              </svg>
              <span>Stop</span>
            </button>
            <!-- Send button (show when not streaming) -->
            <button
              type="submit"
              x-show="!isStreaming"
              :disabled="!sessionId || !prompt.trim()"
              class="px-6 py-2 bg-blue-600 dark:bg-blue-500 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600 transition disabled:bg-gray-300 dark:disabled:bg-gray-700 disabled:cursor-not-allowed"
            >
              Send
            </button>
          </form>
        </div>
      </div>

      <!-- ========================================
           RIGHT PANEL: METRICS & TABS
           Components: metricsPanel, planPanel, eventsPanel, approvalsPanel
           ======================================== -->
      <!-- Right: Events & Tools -->
      <div class="w-96 bg-gray-50 dark:bg-gray-900 border-l border-gray-200 dark:border-gray-700 flex flex-col">
        <!-- ========================================
             SKELETON LOADING UI
             ======================================== -->
        <!-- Skeleton Loading State -->
        <div x-show="isRestoringSession" x-cloak class="flex-1 p-4 space-y-4 animate-pulse">
          <!-- Skeleton Metrics -->
          <div class="bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-gray-800 dark:to-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-4">
            <div class="h-4 bg-gray-300 dark:bg-gray-600 rounded w-32 mb-3"></div>
            <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-full"></div>
          </div>

          <!-- Skeleton Tabs -->
          <div class="flex gap-2">
            <div class="h-8 bg-gray-300 dark:bg-gray-700 rounded w-16"></div>
            <div class="h-8 bg-gray-300 dark:bg-gray-700 rounded w-20"></div>
            <div class="h-8 bg-gray-300 dark:bg-gray-700 rounded w-16"></div>
          </div>

          <!-- Skeleton Content Cards -->
          <div class="space-y-3">
            <div class="bg-white dark:bg-gray-800 rounded-lg p-4 border border-gray-200 dark:border-gray-700">
              <div class="h-3 bg-gray-300 dark:bg-gray-600 rounded w-3/4 mb-2"></div>
              <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-full mb-2"></div>
              <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-5/6"></div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-lg p-4 border border-gray-200 dark:border-gray-700">
              <div class="h-3 bg-gray-300 dark:bg-gray-600 rounded w-2/3 mb-2"></div>
              <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-full mb-2"></div>
              <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-4/5"></div>
            </div>
            <div class="bg-white dark:bg-gray-800 rounded-lg p-4 border border-gray-200 dark:border-gray-700">
              <div class="h-3 bg-gray-300 dark:bg-gray-600 rounded w-1/2 mb-2"></div>
              <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-full mb-2"></div>
              <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-3/4"></div>
            </div>
          </div>
        </div>

        <!-- Real Content (with fade-in) -->
        <div x-show="!isRestoringSession" x-cloak x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="h-full flex flex-col">
        <!-- ========================================
             TAB NAVIGATION
             ======================================== -->
        <!-- Tabs -->
        <div class="border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 flex-shrink-0">
          <nav class="flex">
            <button
              @click="activeTab = 'project'"
              :class="activeTab === 'project' ? 'border-green-600 dark:border-green-500 text-green-600 dark:text-green-400' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'"
              class="px-3 py-3 text-sm font-medium border-b-2 transition"
            >
              Project
            </button>
            <button
              @click="activeTab = 'activities'"
              :class="activeTab === 'activities' ? 'border-yellow-600 dark:border-yellow-500 text-yellow-600 dark:text-yellow-400' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'"
              class="px-3 py-3 text-sm font-medium border-b-2 transition"
            >
              Activities
            </button>
            <button
              @click="activeTab = 'agents'"
              :class="activeTab === 'agents' ? 'border-purple-600 dark:border-purple-500 text-purple-600 dark:text-purple-400' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'"
              class="px-3 py-3 text-sm font-medium border-b-2 transition"
            >
              Agents
            </button>
            <button
              @click="activeTab = 'task'"
              :class="activeTab === 'task' ? 'border-blue-600 dark:border-blue-500 text-blue-600 dark:text-blue-400' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'"
              class="px-3 py-3 text-sm font-medium border-b-2 transition"
            >
              Task
            </button>
            <button
              @click="activeTab = 'events'"
              :class="activeTab === 'events' ? 'border-blue-600 dark:border-blue-500 text-blue-600 dark:text-blue-400' : 'border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'"
              class="px-3 py-3 text-sm font-medium border-b-2 transition"
            >
              Events
            </button>
          </nav>
        </div>

        <!-- Tab Content Container -->
        <div class="flex-1 min-h-0 overflow-y-auto">
          <!-- ========================================
               EVENTS TAB (lines 745-926)
               Component: eventsPanel.js
               ======================================== -->
          <!-- Events tab -->
          <div x-html="eventsTabTemplate()"></div>

        <!-- ========================================
             TASK TAB (formerly Plan)
             Component: planPanel.js
             ======================================== -->
        <!-- Task tab -->
        <div x-html="taskTabTemplate()"></div>

        <!-- ========================================
             PROJECT TAB - Process Progress
             ======================================== -->
        <!-- Project tab -->
        <div x-html="projectTabTemplate()"></div>

        <!-- ========================================
             ACTIVITIES TAB - Execution Results
             ======================================== -->
        <!-- Activities tab -->
        <div x-html="activitiesTabTemplate()"></div>

        <!-- ========================================
             AGENTS TAB
             ======================================== -->
        <!-- Agents tab -->
        <div x-html="agentsTabTemplate()"></div>

        </div>
        <!-- End Tab Content Container -->

        <!-- ========================================
             METRICS PANEL (Bottom, Compact)
             Template: metricsPanelTemplate.js
             ======================================== -->
        <div x-html="metricsPanelTemplate()"></div>

        </div>
        <!-- End Real Content -->
      </div>
    </div>

    <!-- ========================================
         DOCUMENT EDITOR MODAL (DaisyUI)
         Template: documentModal.js
         ======================================== -->
    <div x-html="documentModalTemplate()"></div>
  </div>
  <!-- End x-data scope -->

  <!-- Bootstrap Alpine.js with ES6 modules -->
  <script type="module" src="../js/alpine-bootstrap.js?v=8"></script>
</body>
</html>
