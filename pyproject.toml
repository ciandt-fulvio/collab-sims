[project]
name = "collab-sims"
version = "0.1.0"
description = "AI Agent Collaboration Simulator - Web UI for monitoring and interacting with Claude agents"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Fulvio" }
]

dependencies = [
    # Claude Agent SDK - for real agent execution
    "claude-agent-sdk>=0.1.6",

    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Data Validation
    "pydantic>=2.9.0",

    # Database
    "aiosqlite>=0.20.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",      # Parallel test execution
    "pytest-timeout>=2.3.0",     # Test timeouts
    "pytest-html>=4.1.0",        # HTML test reports

    # Linting & Formatting
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["collab_sims"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "-ra",                    # Show summary of all test outcomes
    "--tb=short",             # Shorter traceback format
    "--disable-warnings",     # Disable warnings for cleaner output
]

# Timeout settings (in seconds)
timeout = 60                  # Default timeout for all tests
timeout_method = "thread"     # Use thread-based timeout
